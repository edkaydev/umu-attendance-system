# Demo deployment — Ubuntu VM 172.209.216.102 (Azure, South Africa North)
#
# Canonical URL: https://172.209.216.102.sslip.io
# sslip.io is a wildcard DNS service: <ip>.sslip.io resolves to <ip>, letting
# Let's Encrypt issue a trusted certificate even though the server has no
# real domain. Visitors typing http://<bare-ip> are redirected here by the
# default_server block below.
#
# For the production domain later, replace DEMO-HOST everywhere and point the
# certificate paths at the new Let's Encrypt directory.

upstream umu_app {
    server app:4000;
}

# ── Port 80: ACME challenges + force HTTPS ──────────────────────────────────
# default_server catches every Host header — including the bare IP — so any
# http://172.209.216.102/... request lands on the canonical https URL.
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    # Let's Encrypt HTTP-01 renewals while nginx is up (webroot mode)
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type "text/plain";
    }

    location / {
        return 301 https://172.209.216.102.sslip.io$request_uri;
    }
}

# ── Port 443: the application ───────────────────────────────────────────────
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name 172.209.216.102.sslip.io;

    ssl_certificate     /etc/letsencrypt/live/172.209.216.102.sslip.io/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/172.209.216.102.sslip.io/privkey.pem;

    # Modern TLS only
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # Security headers (helmet covers the API; these cover the PWA shell)
    add_header Strict-Transport-Security "max-age=15552000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    client_max_body_size 10m;

    # Serve React PWA
    root /usr/share/nginx/html;
    index index.html;

    # Hashed build assets are immutable: cache hard, but NEVER fall back to
    # index.html — serving HTML for a missing .js yields a blank white page.
    location /assets/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Entry points that must always revalidate, or PWA updates never land.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }
    location = /sw.js {
        add_header Cache-Control "no-cache";
    }
    location = /registerSW.js {
        add_header Cache-Control "no-cache";
    }
    location = /manifest.webmanifest {
        add_header Cache-Control "no-cache";
    }

    # SPA routes + everything else (icons etc.)
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }

    # Proxy API requests to the Node.js app container(s).
    # Docker's embedded DNS re-resolves `app` every 10 s so replicas added or
    # removed via `docker compose up --scale app=N` are picked up live.
    location /api/ {
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $app_upstream app;
        proxy_pass http://$app_upstream:4000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_next_upstream error timeout http_502 http_503;
        proxy_connect_timeout 5s;

        # Long-lived requests (PDF generation can take several seconds)
        proxy_read_timeout 60s;
    }
}
