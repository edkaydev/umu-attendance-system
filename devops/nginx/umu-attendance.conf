server {
    listen 80;
    server_name 102.133.161.8.sslip.io 102.133.161.8 _;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name 102.133.161.8.sslip.io 102.133.161.8 _;

    ssl_certificate /etc/letsencrypt/live/102.133.161.8.sslip.io/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/102.133.161.8.sslip.io/privkey.pem;

    client_max_body_size 10m;

    # Serve React PWA
    root /usr/share/nginx/html;
    index index.html;
    location / {
        try_files $uri $uri/ /index.html;
    }

    # PWA assets should not be cached aggressively
    location ~* \.(?:js|css|png|svg|webmanifest|ico)$ {
        try_files $uri $uri/ /index.html;
        expires 7d;
        add_header Cache-Control "public";
    }

    # Proxy API requests to Node.js
    location /api/ {
        proxy_pass http://app:4000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
