# Replace YOUR-DOMAIN with your actual domain (e.g. attendance.umu.ac.ug) in:
#   - both server_name directives
#   - both ssl_certificate / ssl_certificate_key paths
# Run: grep -n "YOUR-DOMAIN" devops/nginx/umu-attendance.conf  to confirm nothing is left.

server {
    listen 80;
    server_name YOUR-DOMAIN;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name YOUR-DOMAIN;

    ssl_certificate /etc/letsencrypt/live/YOUR-DOMAIN/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/YOUR-DOMAIN/privkey.pem;

    client_max_body_size 10m;

    # Serve React PWA
    root /usr/share/nginx/html;
    index index.html;

    # Hashed build assets are immutable: cache hard, but NEVER fall back to
    # index.html — serving HTML for a missing .js yields a blank white page.
    location /assets/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Entry points that must always revalidate, or PWA updates never land.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }
    location = /sw.js {
        add_header Cache-Control "no-cache";
    }
    location = /registerSW.js {
        add_header Cache-Control "no-cache";
    }
    location = /manifest.webmanifest {
        add_header Cache-Control "no-cache";
    }

    # SPA routes + everything else (icons etc.)
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }

    # Proxy API requests to the Node.js app replicas.
    # Docker's embedded DNS (127.0.0.11) round-robins across all healthy
    # containers behind the `app` service name; re-resolving every 10 s
    # picks up replicas added/removed via `docker compose up --scale app=N`.
    location /api/ {
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $app_upstream app;
        proxy_pass http://$app_upstream:4000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_next_upstream error timeout http_502 http_503;
        proxy_connect_timeout 5s;
    }
}
