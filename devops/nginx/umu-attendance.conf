server {
    listen 80;
    server_name 102.133.161.8.sslip.io 102.133.161.8 _;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name 102.133.161.8.sslip.io 102.133.161.8 _;

    ssl_certificate /etc/letsencrypt/live/102-133-161-8.sslip.io/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/102-133-161-8.sslip.io/privkey.pem;

    client_max_body_size 10m;

    # Serve React PWA
    root /usr/share/nginx/html;
    index index.html;

    # Hashed build assets are immutable: cache hard, but NEVER fall back to
    # index.html — serving HTML for a missing .js yields a blank white page.
    location /assets/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Entry points that must always revalidate, or PWA updates never land.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }
    location = /sw.js {
        add_header Cache-Control "no-cache";
    }
    location = /registerSW.js {
        add_header Cache-Control "no-cache";
    }
    location = /manifest.webmanifest {
        add_header Cache-Control "no-cache";
    }

    # SPA routes + everything else (icons etc.)
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }

    # Proxy API requests to Node.js
    location /api/ {
        proxy_pass http://app:4000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
