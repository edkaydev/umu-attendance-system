name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  client:
    name: Client — typecheck & build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: client/package-lock.json
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm run build

  server:
    name: Server — typecheck, build & test
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: test-root
          MYSQL_DATABASE: umu_attendance
          MYSQL_USER: umu_user
          MYSQL_PASSWORD: test-password
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost -u root -ptest-root"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: server/package-lock.json
      - run: npm ci
      - run: npx prisma generate
      # Fresh-install path: apply the consolidated init SQL directly, then mark
      # all incremental migrations as resolved so Prisma's history is in sync.
      # (Running `prisma migrate deploy` on a clean DB fails because the two
      # legacy 2025-era migrations reference tables that don't exist yet — they
      # were written against an older schema and superseded by the 2026 init.)
      - name: Apply schema (init SQL)
        env:
          MYSQL_PWD: test-password
        run: |
          mysql -h 127.0.0.1 -u umu_user umu_attendance \
            < prisma/migrations/init/migration.sql
      - name: Mark all migrations as applied
        env:
          DATABASE_URL: mysql://umu_user:test-password@localhost:3306/umu_attendance
        run: bash ../devops/scripts/mark-migrations-applied.sh
      - run: npm run build
      - run: npx vitest run

  docker:
    name: Docker image build
    runs-on: ubuntu-latest
    needs: [client, server]
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t umu-attendance-server:${{ github.sha }} .
